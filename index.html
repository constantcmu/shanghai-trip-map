<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shanghai Plan B Master Map (6–11 ธ.ค. 2569)</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --sub: #475569;
      --muted: #64748b;
      --accent: #0284c7;
      --accent-soft: #e0f2fe;
      --sidebar-w: 420px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Noto Sans Thai', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      max-width: 100vw;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 4px 0 24px rgba(15, 23, 42, 0.08);
      transition: margin-left 0.25s ease, transform 0.25s ease;
    }
    .sidebar.collapsed {
      margin-left: calc(-1 * var(--sidebar-w));
    }

    /* Header */
    .header {
      padding: 14px 16px 12px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      flex-shrink: 0;
    }
    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .header-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }
    .header-sub {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 2px;
    }
    .btn-add-place {
      border: 1px solid rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.16);
      color: #7dd3fc;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .btn-add-place:hover {
      background: rgba(56, 189, 248, 0.28);
      color: #ffffff;
    }

    .stats-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .stat-pill {
      font-size: 11px;
      font-weight: 500;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 3px 9px;
      border-radius: 999px;
    }

    /* Day & Mode Tabs */
    .nav-wrap {
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      flex-shrink: 0;
    }
    .day-tabs {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .day-tabs::-webkit-scrollbar { display: none; }

    .day-tab {
      border: 1px solid transparent;
      background: transparent;
      color: var(--sub);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .day-tab:hover {
      background: rgba(255, 255, 255, 0.65);
      color: var(--text);
    }
    .day-tab.active {
      background: #ffffff;
      color: var(--text);
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
    }
    .day-tab.zone-tab.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    /* Sidebar Scrollable Content */
    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      background: #f8fafc;
    }

    /* Overview Day Cards */
    .overview-banner {
      background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .overview-banner h2 {
      font-size: 13.5px;
      font-weight: 700;
      color: #1e3a8a;
    }
    .overview-banner p {
      font-size: 12px;
      color: #334155;
      margin-top: 3px;
      line-height: 1.45;
    }
    .hotel-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-left: 4px solid #7c3aed;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .hotel-card:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }
    .hotel-card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .hotel-card-sub {
      font-size: 11.5px;
      color: var(--sub);
      margin-top: 2px;
    }

    .day-summary-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 13px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .day-summary-card:hover {
      border-color: #94a3b8;
      box-shadow: var(--shadow-sm);
    }
    .day-summary-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .day-summary-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
    }
    .day-badge {
      font-size: 11px;
      font-weight: 600;
      background: #f1f5f9;
      color: #334155;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .day-summary-sub {
      font-size: 12px;
      color: var(--sub);
      margin-top: 3px;
    }
    .day-summary-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Day Timeline View */
    .day-header-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .day-header-box h2 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .day-header-box p {
      font-size: 12.5px;
      color: var(--sub);
      margin-top: 3px;
    }

    .timeline {
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .timeline-connector {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0 6px 15px;
    }
    .connector-line {
      width: 3px;
      height: 28px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .connector-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--sub);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      line-height: 1.3;
    }
    .connector-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .step-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .step-card:hover {
      border-color: #94a3b8;
      box-shadow: var(--shadow-sm);
    }
    .step-card.active {
      border-color: var(--accent);
      background: #f0f9ff;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.14);
    }
    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
    }
    .step-content {
      flex: 1;
      min-width: 0;
    }
    .step-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 3px;
    }
    .step-time {
      font-size: 11px;
      font-weight: 700;
      color: #0369a1;
      background: #e0f2fe;
      padding: 1px 7px;
      border-radius: 6px;
    }
    .step-zone-tag {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .step-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
    }
    .step-cn {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 1px;
    }
    .step-note {
      font-size: 11.5px;
      color: var(--sub);
      margin-top: 4px;
      line-height: 1.4;
    }
    .step-thumb {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: #e2e8f0;
    }

    /* Zone Filter & Search View */
    .search-box {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      background: #ffffff;
      color: var(--text);
      outline: none;
      margin-bottom: 10px;
    }
    .search-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }
    .zone-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .zone-pill {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--sub);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .zone-pill.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }
    .zone-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .place-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      gap: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .place-card:hover {
      border-color: #94a3b8;
      box-shadow: var(--shadow-sm);
    }
    .place-card-body { flex: 1; min-width: 0; }
    .place-card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 4px;
    }
    .mini-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 999px;
      background: #f1f5f9;
      color: var(--sub);
    }
    .mini-badge.custom {
      background: #fef3c7;
      color: #92400e;
    }
    .btn-del-custom {
      border: none;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 6px;
    }

    /* Map Container & Floating Controls */
    .map-wrap {
      flex: 1;
      position: relative;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    .sidebar-toggle {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 900;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar-toggle:hover { background: #f8fafc; }

    .map-top-right {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 900;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .map-ctrl-btn {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .map-ctrl-btn.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }
    .map-ctrl-btn.measure-active {
      background: #7c3aed;
      color: #ffffff;
      border-color: #6d28d9;
    }
    #map.measuring { cursor: crosshair !important; }
    .measure-panel {
      position: absolute;
      bottom: 20px;
      left: 56px;
      z-index: 905;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(8px);
      border: 1.5px solid #c4b5fd;
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      padding: 10px 12px;
      min-width: 245px;
      max-width: 310px;
      display: none;
    }
    .measure-panel.open { display: block; }
    .measure-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .measure-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #5b21b6;
    }
    .measure-total {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
    }
    .measure-sub {
      font-size: 11.5px;
      color: var(--sub);
      margin-top: 3px;
      line-height: 1.4;
    }
    .measure-btns {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .measure-btn {
      flex: 1;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      border-radius: 7px;
      padding: 5px 8px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .measure-btn:hover { background: #e2e8f0; }
    .measure-btn.close { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .measure-leg-label {
      background: rgba(91, 33, 182, 0.92) !important;
      color: #ffffff !important;
      border: 1px solid #ffffff !important;
      border-radius: 6px !important;
      padding: 1px 6px !important;
      font-size: 10.5px !important;
      font-weight: 700 !important;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25) !important;
    }
    .dist-chip {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 5px;
      background: #f1f5f9;
      color: #334155;
      font-size: 10.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    .popup-btn.measure {
      background: #f5f3ff;
      color: #6d28d9;
      border: 1px solid #ddd6fe;
    }

    /* Floating Transit Legend */
    .legend-box {
      position: absolute;
      bottom: 20px;
      right: 14px;
      z-index: 900;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      width: 245px;
      overflow: hidden;
    }
    .legend-header {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .legend-body {
      padding: 8px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px 8px;
      max-height: 220px;
      overflow-y: auto;
    }
    .legend-box.collapsed .legend-body { display: none; }
    .legend-box.collapsed .legend-header { border-bottom: none; }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .legend-line {
      width: 18px;
      height: 0;
      border-top: 3.5px solid #000;
      flex-shrink: 0;
    }

    /* Custom Marker Icons */
    .num-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 800;
      border: 2.5px solid #ffffff;
      box-shadow: 0 3px 8px rgba(15, 23, 42, 0.35);
    }
    .zone-marker {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.35);
    }
    .hotel-marker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #7c3aed;
      color: #ffffff;
      border: 2.5px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 3px 8px rgba(124, 58, 237, 0.45);
    }
    .custom-marker {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #f59e0b;
      color: #ffffff;
      border: 2.5px dashed #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(217, 119, 6, 0.45);
    }

    .leaflet-tooltip.place-label {
      background: rgba(15, 23, 42, 0.88);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 2px 7px;
      font-family: 'Noto Sans Thai', 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }
    .leaflet-tooltip.place-label::before {
      border-top-color: rgba(15, 23, 42, 0.88);
    }

    /* Rich Popup */
    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.22);
    }
    .leaflet-popup-content {
      margin: 0;
      width: 290px !important;
      font-family: 'Noto Sans Thai', 'Inter', sans-serif;
    }
    .popup-img {
      width: 100%;
      height: 145px;
      object-fit: cover;
      display: block;
      background: #e2e8f0;
    }
    .popup-body {
      padding: 12px 14px;
    }
    .popup-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }
    .popup-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      color: #ffffff;
    }
    .popup-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .popup-cn {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .popup-info {
      font-size: 12px;
      color: var(--sub);
      margin-top: 8px;
      line-height: 1.45;
    }
    .popup-metro {
      margin-top: 6px;
      padding: 6px 8px;
      background: #f1f5f9;
      border-radius: 8px;
      font-size: 11.5px;
      color: #334155;
    }
    .popup-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .popup-btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 8px;
      transition: opacity 0.15s;
    }

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="data/trip_data.js"></script>
  <script>
    (function () {
      const DATA = window.TRIP_DATA;
      if (!DATA) {
        alert('ไม่พบข้อมูล data/trip_data.js');
        return;
      }

      const STORAGE_KEY = 'shanghai_planb_custom_places_v1';
      let currentView = 'overview'; // 'overview' | 'zones' | 'd1'..'d6'
      let selectedZone = 'all';
      let searchQuery = '';
      let showLabels = false;
      let activeStepNo = null;

      // Map setup
      const map = L.map('map', { zoomControl: false }).setView([31.2304, 121.4737], 12);
      L.control.zoom({ position: 'bottomleft' }).addTo(map);

      L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
        subdomains: ['1', '2', '3', '4'],
        attribution: '&copy; 高德地图 Amap',
        maxNativeZoom: 18,
        maxZoom: 19
      }).addTo(map);

      const routeLayerGroup = L.layerGroup().addTo(map);
      const markerLayerGroup = L.layerGroup().addTo(map);
      const measureLayerGroup = L.layerGroup().addTo(map);
      let markerRefsByPlaceId = {};
      let stepMarkerRefs = {};
      let measureMode = false;
      let measurePoints = [];

      // Distance Helpers
      function calcDistMeters(lat1, lng1, lat2, lng2) {
        const R = 6371000;
        const toRad = (d) => (d * Math.PI) / 180;
        const dLat = toRad(lat2 - lat1);
        const dLng = toRad(lng2 - lng1);
        const a = Math.sin(dLat / 2) ** 2 +
          Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(a));
      }

      function calcCoordsMeters(coords) {
        if (!Array.isArray(coords) || coords.length < 2) return 0;
        let total = 0;
        for (let i = 1; i < coords.length; i++) {
          total += calcDistMeters(coords[i - 1][0], coords[i - 1][1], coords[i][0], coords[i][1]);
        }
        return total;
      }

      function formatDist(m) {
        if (m < 1000) return `${Math.round(m / 10) * 10 || Math.round(m)} ม.`;
        return `${(m / 1000).toFixed(2)} กม.`;
      }

      function formatWalkTime(m) {
        const mins = Math.max(1, Math.round(m / 75)); // ~4.5 km/h city walking pace
        if (mins < 60) return `เดิน ~${mins} นาที`;
        const h = Math.floor(mins / 60);
        const rem = mins % 60;
        return rem ? `เดิน ~${h} ชม. ${rem} น.` : `เดิน ~${h} ชม.`;
      }

      function getStepDistanceStats(step) {
        const segs = Array.isArray(step.segments) && step.segments.length
          ? step.segments
          : (Array.isArray(step.coords) && step.coords.length >= 2 ? [{ mode: step.mode, coords: step.coords }] : []);
        let totalMeters = 0;
        let walkMeters = 0;
        segs.forEach((seg) => {
          const d = calcCoordsMeters(seg.coords);
          totalMeters += d;
          if (seg.mode === 'walk') walkMeters += d;
        });
        return { totalMeters, walkMeters };
      }

      // Helpers
      function esc(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function loadCustomPlaces() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function saveCustomPlaces(list) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      }

      function getAllPlaces() {
        return [...DATA.places, ...loadCustomPlaces()];
      }

      function getPlaceMap() {
        const m = {};
        getAllPlaces().forEach((p) => { m[p.id] = p; });
        return m;
      }

      function getTransitStyle(mode) {
        return DATA.transitStyles[mode] || { label: mode, color: '#475569', weight: 3.5 };
      }

      function buildPopupHtml(place, stepInfo) {
        const zone = DATA.zones[place.zone] || { shortName: place.zone, color: '#0284c7' };
        const amapUrl = `https://uri.amap.com/marker?position=${place.lng},${place.lat}&name=${encodeURIComponent(place.cn || place.name)}`;
        const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${place.lat},${place.lng}`;
        const imgHtml = place.img
          ? `<img class="popup-img" src="${esc(place.img)}" alt="${esc(place.name)}" onerror="this.style.display='none'" />`
          : '';
        const stepBadge = stepInfo
          ? `<span class="popup-badge" style="background:#0f172a;">Step ${esc(stepInfo.stepNo)} • ${esc(stepInfo.time)}</span>`
          : '';
        const customBadge = place.isCustom
          ? `<span class="popup-badge" style="background:#d97706;">หมุดที่เพิ่มเอง</span>`
          : '';

        return `
          ${imgHtml}
          <div class="popup-body">
            <div class="popup-badges">
              ${stepBadge}
              <span class="popup-badge" style="background:${esc(zone.color)};">${esc(zone.shortName)}</span>
              ${customBadge}
            </div>
            <div class="popup-title">${esc(place.name)}</div>
            ${place.cn ? `<div class="popup-cn">${esc(place.cn)}</div>` : ''}
            ${stepInfo && stepInfo.transitText ? `<div class="popup-metro">🚇 <strong>การเดินทาง:</strong> ${esc(stepInfo.transitText)}</div>` : ''}
            ${place.metro ? `<div class="popup-metro">📍 <strong>สถานี/จุดสังเกต:</strong> ${esc(place.metro)}</div>` : ''}
            ${place.note ? `<div class="popup-info">${esc(place.note)}</div>` : ''}
            <div class="popup-actions">
              <a class="popup-btn amap" href="${amapUrl}" target="_blank" rel="noopener">เปิด Amap</a>
              <a class="popup-btn gmap" href="${gmapUrl}" target="_blank" rel="noopener">Google Maps</a>
              <button class="popup-btn measure js-measure-from" type="button" data-lat="${place.lat}" data-lng="${place.lng}" data-name="${esc(place.name)}">📏 วัดจากนี่</button>
              ${place.isCustom ? `<button class="popup-btn js-delete-custom" type="button" data-del-id="${esc(place.id)}" style="background:#fef2f2; color:#dc2626; border:1px solid #fecaca;">🗑️ ลบหมุด</button>` : ''}
            </div>
          </div>
        `;
      }

      // Header & Stats
      function renderHeader() {
        document.getElementById('app-title').textContent = `${DATA.meta.title} (${DATA.meta.dates})`;
        document.getElementById('app-subtitle').textContent = `${DATA.meta.subtitle} • ${DATA.meta.datesEn}`;
        const customCount = loadCustomPlaces().length;
        const totalPlaces = DATA.places.length + customCount;
        document.getElementById('stats-bar').innerHTML = `
          <span class="stat-pill">📍 ${totalPlaces} สถานที่${customCount ? ` (+${customCount} เพิ่มเอง)` : ''}</span>
          <span class="stat-pill">🗓️ ${DATA.days.length} วัน</span>
          <span class="stat-pill">🧭 ${Object.keys(DATA.zones).length} โซน</span>
        `;
      }

      // Day & Navigation Tabs
      function renderTabs() {
        const container = document.getElementById('day-tabs');
        const tabs = [
          { id: 'overview', label: 'ภาพรวมทั้งทริป' },
          ...DATA.days.map((d, idx) => ({ id: d.id, label: `Day ${idx + 1}` })),
          { id: 'zones', label: '🔍 โซน & ค้นหา', isZone: true }
        ];
        container.innerHTML = tabs.map((t) => `
          <button
            class="day-tab ${t.isZone ? 'zone-tab' : ''} ${currentView === t.id ? 'active' : ''}"
            data-view="${esc(t.id)}"
            type="button"
          >${esc(t.label)}</button>
        `).join('');

        container.querySelectorAll('.day-tab').forEach((btn) => {
          btn.addEventListener('click', () => {
            currentView = btn.dataset.view;
            activeStepNo = null;
            renderTabs();
            renderSidebarContent();
            renderMap();
          });
        });
      }

      // Sidebar Content
      function renderSidebarContent() {
        const body = document.getElementById('sidebar-body');

        if (currentView === 'overview') {
          const hotel = DATA.meta.hotel;
          const dayCards = DATA.days.map((d) => `
            <div class="day-summary-card" data-jump-day="${esc(d.id)}">
              <div class="day-summary-top">
                <div class="day-summary-title">${esc(d.title)}</div>
                <span class="day-badge">${esc(d.badge)}</span>
              </div>
              <div class="day-summary-sub">${esc(d.subtitle)}</div>
              <div class="day-summary-meta">
                <span>${d.steps.length} ขั้นตอนการเดินทาง</span>
                <span style="color:#0284c7; font-weight:600;">ดูไทม์ไลน์ →</span>
              </div>
            </div>
          `).join('');

          body.innerHTML = `
            <div class="overview-banner">
              <h2>แผนการเดินทางหลัก Plan B (${esc(DATA.meta.dates)})</h2>
              <p>เลือกดูเส้นทางรายวันแบบ Tour Guide หรือกดแท็บ <strong>🔍 โซน &amp; ค้นหา</strong> เพื่อกรองสถานที่ตาม 6 โซน</p>
            </div>
            <div class="hotel-card" id="overview-hotel-card">
              <div class="hotel-card-title">🏨 โรงแรมฐาน: ${esc(hotel.name)}</div>
              <div class="hotel-card-sub">${esc(hotel.cn)}</div>
              <div class="hotel-card-sub" style="margin-top:3px; color:#5b21b6;">🚇 ${esc(hotel.metro)}</div>
            </div>
            ${dayCards}
          `;

          document.getElementById('overview-hotel-card').addEventListener('click', () => {
            focusPlace(hotel.id);
          });
          body.querySelectorAll('[data-jump-day]').forEach((card) => {
            card.addEventListener('click', () => {
              currentView = card.dataset.jumpDay;
              activeStepNo = null;
              renderTabs();
              renderSidebarContent();
              renderMap();
            });
          });
          return;
        }

        if (currentView === 'zones') {
          const allPlaces = getAllPlaces();
          const filtered = allPlaces.filter((p) => {
            const matchZone = selectedZone === 'all' || p.zone === selectedZone;
            const q = searchQuery.trim().toLowerCase();
            const matchSearch = !q ||
              (p.name && p.name.toLowerCase().includes(q)) ||
              (p.cn && p.cn.toLowerCase().includes(q)) ||
              (p.note && p.note.toLowerCase().includes(q)) ||
              (p.metro && p.metro.toLowerCase().includes(q));
            return matchZone && matchSearch;
          });

          const zonePills = [
            `<button class="zone-pill ${selectedZone === 'all' ? 'active' : ''}" data-zone="all" type="button">ทั้งหมด (${allPlaces.length})</button>`,
            ...Object.values(DATA.zones).map((z) => `
              <button class="zone-pill ${selectedZone === z.id ? 'active' : ''}" data-zone="${esc(z.id)}" type="button">
                <span class="zone-dot" style="background:${esc(z.color)};"></span>
                ${esc(z.shortName)}
              </button>
            `)
          ].join('');

          const cardsHtml = filtered.length
            ? filtered.map((p) => {
                const z = DATA.zones[p.zone] || { shortName: p.zone, color: '#64748b' };
                const thumb = p.img
                  ? `<img class="step-thumb" src="${esc(p.img)}" alt="${esc(p.name)}" onerror="this.style.display='none'" />`
                  : '';
                const delBtn = p.isCustom
                  ? `<button class="btn-del-custom" data-del-id="${esc(p.id)}" type="button">ลบหมุดนี้</button>`
                  : '';
                return `
                  <div class="place-card" data-place-id="${esc(p.id)}">
                    <div class="place-card-body">
                      <div class="place-card-badges">
                        <span class="mini-badge" style="background:${esc(z.color)}18; color:${esc(z.color)};">${esc(z.shortName)}</span>
                        ${p.day ? `<span class="mini-badge">${esc(p.day.toUpperCase())}</span>` : ''}
                        ${p.isCustom ? `<span class="mini-badge custom">เพิ่มเอง</span>` : ''}
                      </div>
                      <div class="step-title">${esc(p.name)}</div>
                      ${p.cn ? `<div class="step-cn">${esc(p.cn)}</div>` : ''}
                      ${p.note ? `<div class="step-note">${esc(p.note)}</div>` : ''}
                      ${delBtn}
                    </div>
                    ${thumb}
                  </div>
                `;
              }).join('')
            : `<div style="text-align:center; color:#64748b; padding:24px 0; font-size:13px;">ไม่พบสถานที่ที่ตรงกับเงื่อนไข</div>`;

          body.innerHTML = `
            <input class="search-box" id="zone-search-input" type="text" placeholder="🔍 ค้นหาชื่อสถานที่ ภาษาจีน สถานี Metro..." value="${esc(searchQuery)}" />
            <div class="zone-pills">${zonePills}</div>
            <div style="font-size:11.5px; color:#64748b; margin-bottom:8px;">พบ ${filtered.length} สถานที่ (คลิกเพื่อซูมบนแผนที่)</div>
            ${cardsHtml}
          `;

          const searchInput = document.getElementById('zone-search-input');
          searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderSidebarContent();
            renderMap();
            const el = document.getElementById('zone-search-input');
            if (el) {
              el.focus();
              el.setSelectionRange(el.value.length, el.value.length);
            }
          });

          body.querySelectorAll('.zone-pill').forEach((pill) => {
            pill.addEventListener('click', () => {
              selectedZone = pill.dataset.zone;
              renderSidebarContent();
              renderMap();
            });
          });

          body.querySelectorAll('.place-card').forEach((card) => {
            card.addEventListener('click', (e) => {
              if (e.target.closest('.btn-del-custom')) return;
              focusPlace(card.dataset.placeId);
            });
          });

          body.querySelectorAll('.btn-del-custom').forEach((btn) => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              const id = btn.dataset.delId;
              saveCustomPlaces(loadCustomPlaces().filter((x) => x.id !== id));
              renderHeader();
              renderSidebarContent();
              renderMap();
            });
          });
          return;
        }

        // Day Timeline View (d1..d6)
        const day = DATA.days.find((d) => d.id === currentView);
        if (!day) return;

        const placeMap = getPlaceMap();
        function renderStepsList(steps) {
          return steps.map((step, idx) => {
            const place = placeMap[step.placeId] || { id: step.placeId, name: step.placeId, zone: 'z1' };
            const zone = DATA.zones[place.zone] || { shortName: place.zone, color: '#0284c7' };
            const tStyle = getTransitStyle(step.mode);
            const thumb = place.img
              ? `<img class="step-thumb" src="${esc(place.img)}" alt="${esc(place.name)}" onerror="this.style.display='none'" />`
              : '';

            const { totalMeters, walkMeters } = getStepDistanceStats(step);
            const distChip = totalMeters > 0
              ? (step.mode === 'walk'
                ? `<span class="dist-chip">📏 ${formatDist(totalMeters)} · ${formatWalkTime(totalMeters)}</span>`
                : `<span class="dist-chip">📏 ${formatDist(totalMeters)}${walkMeters > 60 ? ` · เดิน ${formatDist(walkMeters)}` : ''}</span>`)
              : '';

            const connectorHtml = idx > 0 || step.isAltStart
              ? `
                <div class="timeline-connector">
                  <div class="connector-line" style="background:${esc(tStyle.color)}; ${tStyle.dash ? 'opacity:0.75;' : ''}"></div>
                  <div class="connector-pill">
                    <span class="connector-dot" style="background:${esc(tStyle.color)};"></span>
                    <span><strong>${esc(tStyle.label)}</strong> · ${esc(step.transitText)}${distChip}</span>
                  </div>
                </div>
              `
              : (step.transitText
                ? `
                  <div class="timeline-connector">
                    <div class="connector-pill">
                      <span class="connector-dot" style="background:${esc(tStyle.color)};"></span>
                      <span>${esc(step.transitText)}${distChip}</span>
                    </div>
                  </div>
                `
                : '');

            return `
              ${connectorHtml}
              <div class="step-card ${String(activeStepNo) === String(step.stepNo) ? 'active' : ''}" data-step-no="${esc(step.stepNo)}" data-place-id="${esc(place.id)}">
                <div class="step-num" style="background:${esc(tStyle.color)}; font-size:${String(step.stepNo).length > 1 ? '10.5px' : '12px'};">${esc(step.stepNo)}</div>
                <div class="step-content">
                  <div class="step-top-row">
                    <span class="step-time">${esc(step.time)}</span>
                    <span class="step-zone-tag">${esc(zone.shortName)}</span>
                  </div>
                  <div class="step-title">${esc(place.name)}</div>
                  ${place.cn ? `<div class="step-cn">${esc(place.cn)}</div>` : ''}
                  ${place.note ? `<div class="step-note">${esc(place.note)}</div>` : ''}
                </div>
                ${thumb}
              </div>
            `;
          }).join('');
        }

        const timelineHtml = renderStepsList(day.steps);
        const altHtml = Array.isArray(day.altSteps) && day.altSteps.length
          ? `
            <div style="margin-top:14px; padding:10px 12px; border-radius:12px; background:#f0fdfa; border:1px dashed #0d9488;">
              <div style="font-size:12px; font-weight:700; color:#0f766e; margin-bottom:8px;">
                ${esc(day.altTitle || '🔀 ทางเลือกการเดินทางเสริม')}
              </div>
              <div class="timeline" style="margin:0;">
                ${renderStepsList(day.altSteps.map((s, i) => i === 0 ? { ...s, isAltStart: true } : s))}
              </div>
            </div>
          `
          : '';

        body.innerHTML = `
          <div class="day-header-box">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <h2>${esc(day.title)}</h2>
              <span class="day-badge">${esc(day.badge)}</span>
            </div>
            <p>${esc(day.subtitle)}</p>
          </div>
          <div class="timeline">${timelineHtml}</div>
          ${altHtml}
        `;

        body.querySelectorAll('.step-card').forEach((card) => {
          card.addEventListener('click', () => {
            const stepNo = card.dataset.stepNo;
            activeStepNo = stepNo;
            body.querySelectorAll('.step-card').forEach((c) => c.classList.toggle('active', String(c.dataset.stepNo) === String(stepNo)));
            focusStep(stepNo, card.dataset.placeId);
          });
        });
      }

      // Map Rendering
      function renderMap() {
        routeLayerGroup.clearLayers();
        markerLayerGroup.clearLayers();
        markerRefsByPlaceId = {};
        stepMarkerRefs = {};

        const placeMap = getPlaceMap();
        function getStepSegments(step) {
          if (Array.isArray(step.segments) && step.segments.length) {
            return step.segments.filter((seg) => Array.isArray(seg.coords) && seg.coords.length >= 2);
          }
          if (Array.isArray(step.coords) && step.coords.length >= 2) {
            return [{ mode: step.mode, coords: step.coords }];
          }
          return [];
        }

        const boundsPoints = [];

        if (currentView === 'overview' || currentView === 'zones') {
          // Draw subtle overview routes on overview
          if (currentView === 'overview') {
            DATA.days.forEach((day) => {
              day.steps.forEach((step) => {
                getStepSegments(step).forEach((seg) => {
                  const st = getTransitStyle(seg.mode);
                  L.polyline(seg.coords, {
                    color: st.color,
                    weight: Math.max(2.5, (st.weight || 3.5) - 1),
                    dashArray: st.dash || null,
                    opacity: 0.55
                  }).addTo(routeLayerGroup);
                });
              });
            });
          }

          const allPlaces = getAllPlaces();
          const visiblePlaces = currentView === 'zones'
            ? allPlaces.filter((p) => {
                const matchZone = selectedZone === 'all' || p.zone === selectedZone;
                const q = searchQuery.trim().toLowerCase();
                const matchSearch = !q ||
                  (p.name && p.name.toLowerCase().includes(q)) ||
                  (p.cn && p.cn.toLowerCase().includes(q)) ||
                  (p.note && p.note.toLowerCase().includes(q)) ||
                  (p.metro && p.metro.toLowerCase().includes(q));
                return matchZone && matchSearch;
              })
            : allPlaces;

          visiblePlaces.forEach((place) => {
            const zone = DATA.zones[place.zone] || { color: '#0284c7' };
            let icon;
            if (place.id === 'hotel') {
              icon = L.divIcon({
                className: '',
                html: '<div class="hotel-marker">🏨</div>',
                iconSize: [28, 28],
                iconAnchor: [14, 14]
              });
            } else if (place.isCustom) {
              icon = L.divIcon({
                className: '',
                html: '<div class="custom-marker">+</div>',
                iconSize: [22, 22],
                iconAnchor: [11, 11]
              });
            } else {
              icon = L.divIcon({
                className: '',
                html: `<div class="zone-marker" style="background:${esc(zone.color)};"></div>`,
                iconSize: [16, 16],
                iconAnchor: [8, 8]
              });
            }

            const marker = L.marker([place.lat, place.lng], { icon })
              .bindPopup(buildPopupHtml(place, null), { maxWidth: 300 });

            if (showLabels) {
              marker.bindTooltip(place.name, { permanent: true, direction: 'top', offset: [0, -10], className: 'place-label' });
            }

            marker.on('click', (e) => {
              if (measureMode) {
                L.DomEvent.stopPropagation(e);
                marker.closePopup();
                addMeasurePoint(place.lat, place.lng, place.name);
              }
            });

            marker.addTo(markerLayerGroup);
            markerRefsByPlaceId[place.id] = marker;
            boundsPoints.push([place.lat, place.lng]);
          });
        } else {
          // Specific Day: render multi-point polylines + numbered step markers
          const day = DATA.days.find((d) => d.id === currentView);
          if (day) {
            [...day.steps, ...(Array.isArray(day.altSteps) ? day.altSteps : [])].forEach((step) => {
              getStepSegments(step).forEach((seg) => {
                const st = getTransitStyle(seg.mode);
                const isAlt = typeof step.stepNo === 'string' && step.stepNo.startsWith('B');
                // White casing for clarity
                L.polyline(seg.coords, {
                  color: '#ffffff',
                  weight: (st.weight || 4) + 3,
                  opacity: isAlt ? 0.65 : 0.78
                }).addTo(routeLayerGroup);

                const poly = L.polyline(seg.coords, {
                  color: st.color,
                  weight: st.weight || 4,
                  dashArray: st.dash || (isAlt ? '8,6' : null),
                  opacity: isAlt ? 0.85 : 0.96
                }).addTo(routeLayerGroup);

                poly.bindTooltip(`Step ${step.stepNo} (${st.label}): ${step.transitText}`, { sticky: true });
                seg.coords.forEach((c) => boundsPoints.push(c));
              });
            });

            // Track duplicate place coords within same day so markers don't completely hide each other
            const seenCoordCount = {};
            [...day.steps, ...(Array.isArray(day.altSteps) ? day.altSteps : [])].forEach((step, idx) => {
              const place = placeMap[step.placeId];
              if (!place) return;
              const st = getTransitStyle(step.mode);
              const key = `${place.lat.toFixed(4)},${place.lng.toFixed(4)}`;
              const dupIdx = seenCoordCount[key] || 0;
              seenCoordCount[key] = dupIdx + 1;

              const latOffset = dupIdx * 0.0006;
              const lngOffset = dupIdx * 0.0006;
              const lat = place.lat + latOffset;
              const lng = place.lng + lngOffset;

              const icon = L.divIcon({
                className: '',
                html: `<div class="num-marker" style="background:${esc(st.color)}; font-size:${String(step.stepNo).length > 1 ? '10px' : '12px'};">${esc(step.stepNo)}</div>`,
                iconSize: [28, 28],
                iconAnchor: [14, 14]
              });

              const marker = L.marker([lat, lng], { icon, zIndexOffset: 100 + idx })
                .bindPopup(buildPopupHtml(place, step), { maxWidth: 300 });

              if (showLabels) {
                marker.bindTooltip(`${step.stepNo}. ${place.name}`, {
                  permanent: true,
                  direction: 'top',
                  offset: [0, -14],
                  className: 'place-label'
                });
              }

              marker.on('click', (e) => {
                if (measureMode) {
                  L.DomEvent.stopPropagation(e);
                  marker.closePopup();
                  addMeasurePoint(lat, lng, `${step.stepNo}. ${place.name}`);
                }
              });

              marker.addTo(markerLayerGroup);
              stepMarkerRefs[String(step.stepNo)] = marker;
              markerRefsByPlaceId[place.id] = marker;
              boundsPoints.push([lat, lng]);
            });
          }
        }

        if (boundsPoints.length > 0) {
          map.fitBounds(boundsPoints, { padding: [45, 45], maxZoom: 15 });
        }
      }

      function focusPlace(placeId) {
        const marker = markerRefsByPlaceId[placeId];
        if (!marker) return;
        const ll = marker.getLatLng();
        map.setView(ll, Math.max(map.getZoom(), 15), { animate: true });
        marker.openPopup();
      }

      function focusStep(stepNo, placeId) {
        const marker = stepMarkerRefs[String(stepNo)] || markerRefsByPlaceId[placeId];
        if (!marker) return;
        const ll = marker.getLatLng();
        map.setView(ll, Math.max(map.getZoom(), 15), { animate: true });
        marker.openPopup();
      }

      // Transit Legend
      function renderLegend() {
        const body = document.getElementById('legend-body');
        body.innerHTML = Object.values(DATA.transitStyles).map((st) => `
          <div class="legend-item" title="${esc(st.label)}">
            <span class="legend-line" style="border-top-color:${esc(st.color)}; border-top-style:${st.dash ? 'dashed' : 'solid'};"></span>
            <span>${esc(st.label)}</span>
          </div>
        `).join('');
      }

      // Add Place Modal Logic
      function initModal() {
        const modal = document.getElementById('add-modal');
        const zoneSel = document.getElementById('f-zone');
        const daySel = document.getElementById('f-day');

        zoneSel.innerHTML = Object.values(DATA.zones)
          .map((z) => `<option value="${esc(z.id)}">${esc(z.shortName)}</option>`)
          .join('');
        daySel.innerHTML = DATA.days
          .map((d) => `<option value="${esc(d.id)}">${esc(d.title)}</option>`)
          .join('');

        function getFormPlaceObj() {
          const name = document.getElementById('f-name').value.trim() || 'ชื่อสถานที่ใหม่';
          const cn = document.getElementById('f-cn').value.trim();
          const zone = zoneSel.value;
          const day = daySel.value;
          const lat = parseFloat(document.getElementById('f-lat').value) || 31.2304;
          const lng = parseFloat(document.getElementById('f-lng').value) || 121.4737;
          const timeSlot = document.getElementById('f-time').value.trim() || '14:00 น.';
          const metro = document.getElementById('f-metro').value.trim();
          const note = document.getElementById('f-note').value.trim();
          const id = 'custom_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 20) + '_' + Date.now().toString().slice(-4);
          return { id, name, cn, zone, day, timeSlot, lat, lng, metro, note, img: null };
        }

        function updateSnippet() {
          const obj = getFormPlaceObj();
          document.getElementById('snippet-preview').textContent = JSON.stringify(obj, null, 2) + ',';
        }

        ['f-name', 'f-cn', 'f-zone', 'f-day', 'f-lat', 'f-lng', 'f-time', 'f-metro', 'f-note'].forEach((id) => {
          document.getElementById(id).addEventListener('input', updateSnippet);
          document.getElementById(id).addEventListener('change', updateSnippet);
        });

        document.getElementById('btn-open-add').addEventListener('click', () => {
          updateSnippet();
          modal.classList.add('open');
        });
        document.getElementById('btn-close-add').addEventListener('click', () => modal.classList.remove('open'));
        document.getElementById('btn-cancel-add').addEventListener('click', () => modal.classList.remove('open'));
        modal.addEventListener('click', (e) => {
          if (e.target === modal) modal.classList.remove('open');
        });

        document.getElementById('btn-copy-snippet').addEventListener('click', async () => {
          const text = document.getElementById('snippet-preview').textContent;
          try {
            await navigator.clipboard.writeText(text);
            document.getElementById('btn-copy-snippet').textContent = '✅ คัดลอกแล้ว!';
            setTimeout(() => {
              document.getElementById('btn-copy-snippet').textContent = '📋 คัดลอก Snippet';
            }, 1500);
          } catch {
            alert('ไม่สามารถคัดลอกอัตโนมัติได้ กรุณาเลือกข้อความแล้วคัดลอกเอง');
          }
        });

        document.getElementById('btn-save-custom').addEventListener('click', () => {
          const obj = getFormPlaceObj();
          obj.isCustom = true;
          const list = loadCustomPlaces();
          list.push(obj);
          saveCustomPlaces(list);
          modal.classList.remove('open');
          renderHeader();
          currentView = 'zones';
          selectedZone = obj.zone;
          renderTabs();
          renderSidebarContent();
          renderMap();
          focusPlace(obj.id);
        });

        document.getElementById('btn-clear-custom').addEventListener('click', () => {
          saveCustomPlaces([]);
          modal.classList.remove('open');
          renderHeader();
          renderSidebarContent();
          renderMap();
        });
      }

      // Measure Distance Mode
      function renderMeasureOverlay() {
        measureLayerGroup.clearLayers();
        const countEl = document.getElementById('measure-count');
        const totalEl = document.getElementById('measure-total');
        const subEl = document.getElementById('measure-sub');

        countEl.textContent = `${measurePoints.length} จุด`;
        if (measurePoints.length === 0) {
          totalEl.textContent = '0 ม.';
          subEl.textContent = 'คลิกจุดบนแผนที่หรือหมุดสถานที่เพื่อวัดระยะเดิน/เดินทาง';
          return;
        }

        let totalMeters = 0;
        const latlngs = measurePoints.map((pt) => [pt.lat, pt.lng]);

        if (latlngs.length >= 2) {
          L.polyline(latlngs, {
            color: '#ffffff',
            weight: 6.5,
            opacity: 0.85
          }).addTo(measureLayerGroup);

          L.polyline(latlngs, {
            color: '#7c3aed',
            weight: 3.5,
            dashArray: '7,6',
            opacity: 0.98
          }).addTo(measureLayerGroup);

          for (let i = 1; i < measurePoints.length; i++) {
            const p1 = measurePoints[i - 1];
            const p2 = measurePoints[i];
            const legM = calcDistMeters(p1.lat, p1.lng, p2.lat, p2.lng);
            totalMeters += legM;
            const midLat = (p1.lat + p2.lat) / 2;
            const midLng = (p1.lng + p2.lng) / 2;
            L.tooltip({
              permanent: true,
              direction: 'center',
              className: 'measure-leg-label'
            })
              .setLatLng([midLat, midLng])
              .setContent(formatDist(legM))
              .addTo(measureLayerGroup);
          }
        }

        measurePoints.forEach((pt, idx) => {
          const c = L.circleMarker([pt.lat, pt.lng], {
            radius: 7,
            color: '#ffffff',
            weight: 2.5,
            fillColor: idx === 0 ? '#059669' : '#7c3aed',
            fillOpacity: 1
          }).addTo(measureLayerGroup);
          const tip = pt.label ? `${pt.label} (คลิกเพื่อลบจุดนี้)` : `จุดที่ ${idx + 1} (คลิกเพื่อลบจุดนี้)`;
          c.bindTooltip(tip, { direction: 'top', offset: [0, -6] });
          c.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            measurePoints.splice(idx, 1);
            renderMeasureOverlay();
          });
        });

        totalEl.textContent = formatDist(totalMeters);
        if (measurePoints.length === 1) {
          const first = measurePoints[0];
          subEl.textContent = `เริ่มจาก: ${first.label || 'จุดที่ 1'} — คลิกจุดถัดไป (หรือคลิกจุดเดิมเพื่อลบ)`;
        } else {
          const didiMins = Math.max(2, Math.round(totalMeters / 450)); // ~27 km/h city speed
          subEl.innerHTML = `🚶 <strong>${formatWalkTime(totalMeters)}</strong> &nbsp;·&nbsp; 🚕 DiDi ~${didiMins} นาที<br><span style="color:#64748b; font-size:10.5px;">คลิกจุดวงกลมเพื่อลบจุดนั้น • คลิกขวาเพื่อย้อนกลับ</span>`;
        }
      }

      function toggleMeasureMode(force) {
        measureMode = typeof force === 'boolean' ? force : !measureMode;
        if (!measureMode) {
          measurePoints = [];
        }
        const btn = document.getElementById('btn-toggle-measure');
        const stateEl = document.getElementById('measure-state');
        const panel = document.getElementById('measure-panel');
        const mapEl = document.getElementById('map');

        btn.classList.toggle('measure-active', measureMode);
        stateEl.textContent = measureMode ? 'เปิด' : 'ปิด';
        panel.classList.toggle('open', measureMode);
        mapEl.classList.toggle('measuring', measureMode);
        renderMeasureOverlay();
      }

      function addMeasurePoint(lat, lng, label) {
        measurePoints.push({ lat, lng, label });
        renderMeasureOverlay();
      }

      window.startMeasureFrom = function (lat, lng, label) {
        measurePoints = [{ lat, lng, label }];
        map.closePopup();
        toggleMeasureMode(true);
      };

      map.on('click', (e) => {
        if (measureMode) {
          addMeasurePoint(e.latlng.lat, e.latlng.lng, `จุดที่ ${measurePoints.length + 1}`);
        }
      });

      map.on('contextmenu', (e) => {
        if (measureMode && measurePoints.length > 0) {
          L.DomEvent.preventDefault(e);
          measurePoints.pop();
          renderMeasureOverlay();
        }
      });

      map.on('popupopen', (e) => {
        const el = e.popup && e.popup.getElement();
        if (!el) return;
        const btn = el.querySelector('.js-measure-from');
        if (btn) {
          btn.addEventListener('click', () => {
            window.startMeasureFrom(
              Number(btn.dataset.lat),
              Number(btn.dataset.lng),
              btn.dataset.name || 'จุดเริ่มต้น'
            );
          });
        }
        const delBtn = el.querySelector('.js-delete-custom');
        if (delBtn) {
          delBtn.addEventListener('click', () => {
            const delId = delBtn.dataset.delId;
            saveCustomPlaces(loadCustomPlaces().filter((x) => x.id !== delId));
            map.closePopup();
            renderHeader();
            renderSidebarContent();
            renderMap();
          });
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && measureMode) {
          toggleMeasureMode(false);
        }
      });

      document.getElementById('btn-toggle-measure').addEventListener('click', () => toggleMeasureMode());
      document.getElementById('btn-measure-undo').addEventListener('click', () => {
        measurePoints.pop();
        renderMeasureOverlay();
      });
      document.getElementById('btn-measure-clear').addEventListener('click', () => {
        measurePoints = [];
        renderMeasureOverlay();
      });
      document.getElementById('btn-measure-close').addEventListener('click', () => toggleMeasureMode(false));

      // Global Controls
      document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
        const sb = document.getElementById('sidebar');
        const collapsed = sb.classList.toggle('collapsed');
        document.getElementById('toggle-icon').textContent = collapsed ? '▶' : '◀';
        document.getElementById('toggle-text').textContent = collapsed ? 'แสดงแถบ' : 'ซ่อนแถบ';
        setTimeout(() => map.invalidateSize(), 260);
      });

      document.getElementById('btn-toggle-labels').addEventListener('click', (e) => {
        showLabels = !showLabels;
        e.currentTarget.classList.toggle('active', showLabels);
        document.getElementById('labels-state').textContent = showLabels ? 'เปิด' : 'ปิด';
        renderMap();
      });

      document.getElementById('btn-fit-bounds').addEventListener('click', () => {
        renderMap();
      });

      document.getElementById('legend-toggle').addEventListener('click', () => {
        const box = document.getElementById('legend-box');
        const collapsed = box.classList.toggle('collapsed');
        document.getElementById('legend-caret').textContent = collapsed ? '▸' : '▾';
      });

      // Init
      renderHeader();
      renderTabs();
      renderLegend();
      renderSidebarContent();
      renderMap();
      initModal();
    })();
  </script>
</body>
</html>
